<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Toxic Triangle — Branching Scenario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,800;1,400&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page-bg:#E7E6E6;
  --text-navy:#002F32;
  --label-gray:#595959;
  --eyebrow-teal:#17D1DB;
  --blue-header:#0070C0;
  --blue-cover:#2E75B6;
  --mint-header:#8DEBB1;
  --magenta-header:#BA067A;
  --green-btn:#00B050;
  --green-btn-dark:#00913F;
  --yellow-btn:#FFC000;
  --purple-accent:#7030A0;
  --optA-swatch:#00B0F0; --optA-text:#006258; --optA-bg:#E7FAFB;
  --optB-swatch:#FFD966; --optB-text:#B8722A; --optB-bg:#FFEDD9;
  --optC-swatch:#A32703; --optC-text:#A32703; --optC-bg:#FBDFD8;
  --ending-teal:#006258;
  --ending-amber:#B8722A;
  --ending-red:#A32703;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:#c9c9c7;
  color:var(--text-navy);
  font-family:'Tunga','Lato','Segoe UI',Helvetica,Arial,sans-serif;
  min-height:100vh;
}
.topbar{ position:fixed; top:0; left:0; right:0; height:5px; z-index:60; background:rgba(0,0,0,0.12); }
.topbar-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--green-btn), var(--eyebrow-teal)); transition:width .5s ease; }
.backbtn{
  position:fixed; top:4px; left:10px; z-index:60;
  width:30px; height:34px; padding:0;
  background:none; border:none; box-shadow:none; border-radius:0; cursor:pointer;
  /* White with a soft halo: the chevron sits over the coloured header band,
     which is blue, magenta or mint depending on the screen. */
  color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.55);
  font-family:'Tunga','Lato',sans-serif; font-size:34px; font-weight:300; line-height:1;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
  transition:opacity .25s ease, transform .15s ease;
}
.backbtn.show{ opacity:.55; pointer-events:auto; }
.backbtn:hover{ opacity:1; transform:translateX(-3px); }
.hud{ position:fixed; top:14px; right:18px; z-index:60; display:flex; gap:8px; align-items:center; }
.audio-btn{
  background:var(--text-navy); color:#fff; font-size:11px; font-weight:800;
  letter-spacing:.12em; text-transform:uppercase; font-family:'Tunga','Lato',sans-serif;
  padding:8px 14px; border-radius:3px; border:none; cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,0.25);
  transition:background .15s ease;
}
.audio-btn:hover{ background:var(--blue-header); }
.audio-btn.speaking{ background:var(--green-btn); }
.audio-btn[hidden]{ display:none; }
.score-pill{
  background:var(--text-navy); color:#fff; font-size:12.5px; font-weight:700;
  padding:7px 14px; border-radius:3px; letter-spacing:.02em;
  box-shadow:0 4px 14px rgba(0,0,0,0.25);
  opacity:0; transform:translateY(-6px); transition:opacity .4s ease, transform .4s ease;
  display:flex; align-items:center; gap:7px;
}
.score-pill.show{opacity:1; transform:translateY(0);}
.score-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--eyebrow-teal);}

.wrap{ width:100%; min-height:100vh; display:flex; }
.card{
  width:100%; min-height:100vh; display:flex; flex-direction:column;
  background:var(--page-bg);
  opacity:0; transform:translateY(10px);
  transition:opacity .5s ease, transform .5s ease;
  position:relative;
}
.card.in{opacity:1; transform:translateY(0);}
.card.out{opacity:0; transform:translateY(-8px);}

.header-band{
  padding:52px 64px 38px; background:var(--blue-header); flex:0 0 auto;
  border-bottom:6px solid rgba(0,0,0,0.06);
}
.header-band.theme-mint{ background:var(--mint-header); border-bottom-color:rgba(0,0,0,0.05); }
.header-band.theme-magenta{ background:var(--magenta-header); }
.header-band.theme-checkpoint{ border-top:6px solid var(--purple-accent); }
.header-band.theme-teal{ background:var(--ending-teal); }
.header-band.theme-amber{ background:var(--ending-amber); }
.header-band.theme-red{ background:var(--ending-red); }

.eyebrow{
  font-size:13px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
  color:var(--eyebrow-teal); margin:0 0 14px;
}
h1.title{
  font-family:'Tunga','Lato',sans-serif; font-weight:800; font-size:clamp(30px,4.2vw,44px);
  color:#fff; margin:0; line-height:1.15;
}
.content{ flex:1; display:flex; flex-direction:column; padding:44px 64px 40px; }
@media(max-width:680px){ .header-band{padding:36px 26px 28px;} .content{padding:30px 26px 30px;} }

.subtitle{ color:#fff; opacity:.92; font-size:19px; font-style:italic; margin:10px 0 0; }
p.body-p{ font-size:17px; line-height:1.7; color:var(--text-navy); margin:0 0 18px; max-width:820px; }
.footnote{ font-size:14.5px; color:var(--label-gray); font-style:italic; margin:18px 0 0; }

.meta-grid{ display:grid; grid-template-columns:1fr 2fr; gap:18px 28px; margin:36px 0 0; max-width:820px; }
@media(max-width:680px){ .meta-grid{grid-template-columns:1fr;} }
.meta-item .k{ font-size:12px; font-weight:800; letter-spacing:.12em; color:var(--eyebrow-teal); margin-bottom:2px; }
.meta-item .v{ font-size:15px; color:var(--text-navy); line-height:1.5; }
.cover .meta-item .v{ color:#fff; }
.cover .meta-item .k{ color:var(--eyebrow-teal); }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--green-btn); color:#fff; border:none; cursor:pointer;
  font-family:inherit; font-weight:800; font-size:14px; letter-spacing:.06em;
  padding:17px 30px; border-radius:2px; text-transform:uppercase;
  transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
  box-shadow:0 10px 22px -10px rgba(0,0,0,0.45);
}
.btn:hover{ background:var(--green-btn-dark); transform:translateY(-1px); }
.btn:active{ transform:translateY(0); }
.btn-row{ margin-top:auto; padding-top:36px; display:flex; gap:12px; flex-wrap:wrap; justify-content:flex-end; }
.btn.secondary{ background:transparent; color:var(--text-navy); box-shadow:none; border:2px solid var(--text-navy); }
.btn.secondary:hover{ background:var(--text-navy); color:#fff; }
.btn.yellow{ background:var(--yellow-btn); color:var(--text-navy); }
.btn.yellow:hover{ background:#e6ac00; }
.btn.teal{ background:var(--ending-teal); }
.btn.teal:hover{ background:#004a43; }

.checklist{ margin:6px 0 0; padding:0; max-width:820px; }
.checklist .item{ padding:16px 0; display:flex; gap:16px; align-items:flex-start; }
.checklist .item b{ color:var(--text-navy); }
.checklist .item{ font-size:16.5px; line-height:1.6; color:var(--text-navy); }
.ask-intro{ font-size:18px; font-weight:800; color:var(--blue-header); letter-spacing:.02em; margin:0 0 4px; }
.qmark{ flex:0 0 auto; width:32px; height:32px; border-radius:50%;
        color:#fff; font-weight:800; font-size:17px; line-height:1;
        display:flex; align-items:center; justify-content:center; margin-top:2px; }
.qmark.q{ background:var(--blue-header); }
.qmark.tick{ background:var(--green-btn); font-size:16px; }
.sources-list{ margin:6px 0 0; max-width:820px; }
.source{ padding:16px 0; border-bottom:1px solid rgba(0,0,0,0.10); }
.source:last-child{ border-bottom:none; }
.source .ref{ font-size:16px; line-height:1.6; color:var(--text-navy); }
.source .note{ font-size:14.5px; line-height:1.6; color:var(--label-gray); margin-top:6px; font-style:italic; }
.closing{
  font-size:18px; font-weight:800; font-style:italic; color:var(--ending-amber);
  border-top:1px solid rgba(0,0,0,0.12); padding-top:22px; margin:18px 0 0; max-width:820px;
}

.options{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:30px; align-items:stretch; }
@media(max-width:820px){ .options{grid-template-columns:1fr;} }
.option{
  text-align:left; border:none; border-radius:2px;
  padding:26px 24px 20px; cursor:pointer; font-family:inherit; color:var(--text-navy);
  font-size:16px; line-height:1.5; font-weight:700;
  display:flex; flex-direction:column; min-height:230px;
  box-shadow:7px 7px 0 rgba(0,0,0,0.10);
  transition:transform .15s ease, box-shadow .15s ease;
}
.option:hover{ transform:translate(-2px,-4px); box-shadow:9px 11px 0 rgba(0,0,0,0.14); }
.option .swatch{
  display:block; margin:0 0 14px; width:auto; height:auto;
  font-family:'Caveat', 'Segoe Script', cursive; font-weight:700;
  font-size:62px; line-height:.85; letter-spacing:.02em;
  transform-origin:left center;
}
.option .label-text{ flex:1; }
.option .select{
  display:block; margin-top:18px; padding-top:14px; border-top:1px solid rgba(0,0,0,0.15);
  font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
}
.opt-0{ background:var(--optA-bg); } .opt-0 .swatch{ color:#0070C0; transform:rotate(-5deg); } .opt-0 .select{ color:var(--optA-text); }
.opt-1{ background:var(--optB-bg); } .opt-1 .swatch{ color:#B8722A; transform:rotate(3deg); } .opt-1 .select{ color:var(--optB-text); }
.opt-2{ background:var(--optC-bg); } .opt-2 .swatch{ color:#A32703; transform:rotate(-3deg); } .opt-2 .select{ color:var(--optC-text); }

.choice-swatch-bar{
  width:100%; max-width:420px; height:64px; margin:4px 0 22px; border-radius:1px;
  display:flex; align-items:center; padding:0 22px;
  font-family:'Caveat', 'Segoe Script', cursive; font-weight:700;
  font-size:36px; line-height:1;
}
.csb-0{ background:var(--optA-bg); color:#0070C0; }
.csb-1{ background:var(--optB-bg); color:#B8722A; }
.csb-2{ background:var(--optC-bg); color:#A32703; }
.choice-quote{
  font-size:19px; font-style:italic; color:var(--text-navy); line-height:1.6;
  max-width:820px; padding-bottom:22px; border-bottom:1px solid rgba(0,0,0,0.12); margin-bottom:24px;
}
.wh-label{ font-size:12.5px; font-weight:800; letter-spacing:.14em; color:var(--label-gray); margin:0 0 10px; text-transform:uppercase; }
.extra{ margin-top:14px; font-size:15px; color:var(--label-gray); font-style:italic; max-width:820px; }

.score-box{
  margin:8px 0 0; padding:26px 28px; border-radius:3px; background:var(--text-navy); color:#fff; max-width:560px;
}
.score-box .row{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
.score-box .label{ font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#9fd8d4;}
.score-box .num{ font-size:28px; font-weight:800; }
.score-box .band{ font-size:16px; font-weight:800; color:var(--eyebrow-teal); margin-top:8px;}
.score-box .desc{ font-size:14px; color:#cfe9e7; margin-top:8px; line-height:1.55;}
.bar-track{ height:9px; border-radius:5px; background:rgba(255,255,255,0.18); overflow:hidden; margin-top:12px;}
.bar-fill{ height:100%; background:linear-gradient(90deg,var(--eyebrow-teal),#7CF0DB); transition:width .8s ease; }

.ending-tag{
  display:inline-block; font-size:12px; font-weight:800;
  letter-spacing:.12em; text-transform:uppercase; color:#fff; opacity:.85; margin-bottom:10px;
}
.footer-credit{
  position:absolute; left:64px; bottom:18px; font-size:10px; letter-spacing:.06em; font-style:italic;
  color:rgba(0,47,50,0.55);
}
.footer-credit.on-dark{ color:rgba(255,255,255,0.65); }
@media(max-width:680px){ .footer-credit{left:26px;} }

.recap{ margin-top:20px; max-width:560px; }
.recap summary{ cursor:pointer; font-size:13px; font-weight:800; color:var(--label-gray); letter-spacing:.04em; text-transform:uppercase; }
.recap[open] summary{ margin-bottom:12px; }
.recap .line{ font-size:14.5px; color:var(--text-navy); padding:5px 0; border-bottom:1px dotted rgba(0,0,0,0.12); }

.cover.card, .epilogue.card{ background:var(--blue-cover); }
.epilogue.card{ background:var(--mint-header); }
.cover .content, .epilogue .content{ padding:64px; justify-content:flex-start; }
.cover h1.title{ color:var(--green-btn); font-size:clamp(40px,6vw,64px); }
.epilogue h1.title{ color:#fff; }
.epilogue .eyebrow{ color:rgba(255,255,255,0.75); }
.epilogue p.body-p{ color:#fff; max-width:900px; }
.epilogue .marcus-note{ font-style:italic; color:rgba(255,255,255,0.7); max-width:900px; font-size:15.5px; margin-top:-4px; }
</style>
</head>

<script>

const DATA = {"screens": {"cover": {"type": "cover", "eyebrow": "PORTFOLIO SAMPLE · BRANCHING SCENARIO", "title": "The Toxic Triangle", "subtitle": "A Workplace Dynamics Branching Scenario", "meta": [["FORMAT", "Branching scenario · 3 parts · 7 decision points · 5 endings"], ["AUDIENCE", "Team leads and managers who recognise they're “the one who fixes everything”"], ["OBJECTIVE", "Recognise a toxic triangle, manage it without burning out, and exit cleanly"], ["MECHANIC", "Parts 1–2 are scored and converging; Part 3 is true branching by exit choice"]], "cta": {"label": "BEGIN", "next": "p1_intro"}, "progress": 0}, "p1_intro": {"type": "info", "eyebrow": "PRE-TEACH · PART 1", "title": "Recognise the Triangle", "body": ["Nadia is the Creative Manager at a small, founder-funded startup. She notices every gap, every contradiction, every slipping deadline — and fixes them without being asked. The office runs because she makes it run.", "Before you step into her shoes, this briefing covers the psychological model behind what she's living through — so the choices ahead are informed, not guesswork."], "footnote": "Read the vital information and self-check below, then begin.", "cta": {"label": "CONTINUE", "next": "p1_info"}, "progress": 5}, "p1_info": {"type": "info", "eyebrow": "PRE-TEACH · PART 1", "title": "Vital Information", "body": ["The Toxic Triangle (Padilla, Hogan & Kaiser) says destructive workplace dynamics need three things at once: a destructive leader, susceptible followers, and a conducive environment — remove any one leg and the triangle weakens.", "A destructive leader isn't necessarily malicious — unpredictable, contradictory direction from someone with real authority is enough. That's Vivienne, the Boss: fast, charming on good days, overwhelmed on bad ones.", "A susceptible follower enables by avoidance, not ambition. That's Dana, the Operations Manager: agreeable, conflict-avoidant, trusted instinctively and held accountable rarely.", "A conducive environment is the structure that lets it continue — no HR function, no written role definitions, no one who can formally intervene. Small, founder-funded startups are a common example.", "Nadia's own overfunctioning is part of the system too. In Karpman's Drama Triangle this is the Rescuer role — fixing without being asked feels helpful, but it removes the only feedback that might force change."], "cta": {"label": "CONTINUE", "next": "p1_check"}, "progress": 8}, "p1_check": {"type": "checklist", "eyebrow": "PRE-TEACH · PART 1", "title": "The Self-Check", "items": [["Unasked work", "am I regularly doing work that isn't mine, without being asked, because otherwise it won't get done?"], ["Contradictions", "do I get instructions that contradict each other, with no way to get a straight answer in writing?"], ["Mood and mirror", "is there someone whose mood decides the day, and someone else whose job seems to be agreeing with them?"], ["The one-week test", "if I stopped fixing things for a week, would the business visibly break?"], ["No real backstop", "is there anyone — HR, a board, a co-founder — who could actually intervene, or does every problem stop with the Boss?"]], "closing": "Mostly “yes”? That's not a personality clash — it's the three-factor model, live.", "cta": {"label": "BEGIN PART 1", "next": "opening"}, "progress": 11, "intro": "Ask yourself:", "mark": "q"}, "opening": {"type": "scene", "eyebrow": "OPENING SCENE", "title": "Six Months In", "body": ["It's 6:40pm. Vivienne swings by your desk on her way out: “Can you sort the client deck before tomorrow? Use the numbers from... actually, just make it work, you know what I mean.” She's gone before you can ask which numbers.", "Dana, at the next desk, just nods along and starts packing up. She hasn't touched the deck either. It's the third contradictory brief this week, and you're the only one who seems to notice.", "You are Nadia. What do you do?"], "cta": {"label": "CONTINUE", "next": "d1"}, "progress": 14}, "d1": {"type": "decision", "eyebrow": "DECISION 1 OF 7", "title": "The Pattern", "prompt": "How do you respond to noticing this, again?", "options": [{"label": "Write down what's actually happening — name the pattern to yourself instead of just pushing through it.", "next": "d1_a"}, {"label": "Tell yourself you just need to get better at saying no, and get on with the deck.", "next": "d1_b"}, {"label": "Shrug it off — it's probably just a busy quarter.", "next": "d1_c"}], "progress": 16}, "d1_a": {"type": "outcome", "title": "The Pattern", "choiceLabel": "“Write down what's actually happening — name the pattern to yourself instead of just pushing through it.”", "whatHappens": "Naming it doesn't change tonight's deck, but it changes how you see tomorrow's version of the same request. You've stopped treating it as one bad evening.", "cta": {"label": "CONTINUE", "next": "cp1"}, "progress": 18}, "d1_b": {"type": "outcome", "title": "The Pattern", "choiceLabel": "“Tell yourself you just need to get better at saying no, and get on with the deck.”", "whatHappens": "The deck gets done, like always. Framing it as your own discipline problem keeps the focus on you — not on the three contradictory briefs this week.", "cta": {"label": "CONTINUE", "next": "cp1"}, "progress": 18}, "d1_c": {"type": "outcome", "title": "The Pattern", "choiceLabel": "“Shrug it off — it's probably just a busy quarter.”", "whatHappens": "It's an easy story, and it might even be half true. It's also the same story you told yourself last quarter, and the one before that.", "cta": {"label": "CONTINUE", "next": "cp1"}, "progress": 18}, "cp1": {"type": "checkpoint", "eyebrow": "CHECKPOINT", "title": "End of Part 1", "body": ["Recognising the Triangle is step one.", "Now: what do you actually do about it, while you're still in the job?"], "showScore": false, "cta": {"label": "CONTINUE", "next": "p2_intro"}, "progress": 20}, "p2_intro": {"type": "info", "eyebrow": "PRE-TEACH · PART 2", "title": "Manage It From Inside", "body": ["Naming the pattern doesn't fix it by itself. Nadia is still in the job, still the one everyone relies on — and quitting on day one isn't realistic advice for most people.", "This briefing covers what actually reduces her role in sustaining the triangle, without needing to blow anything up."], "footnote": "Read the vital information and tactics below, then continue.", "cta": {"label": "CONTINUE", "next": "p2_info"}, "progress": 23}, "p2_info": {"type": "info", "eyebrow": "PRE-TEACH · PART 2", "title": "Vital Information", "body": ["Invisible fixing is the highest-leverage problem. Silently patching a contradiction protects the deadline, but it also protects the Boss's carelessness and the Ops Manager's avoidance from ever being seen.", "A written record does double duty. A short recap email after a vague instruction forces it to firm up, and protects Nadia if a decision is disputed later — it's evidence, not confrontation.", "Boundaries only work stated, not just felt. Deciding privately what you won't take on changes nothing; saying it out loud, once, plainly, is what actually holds the line.", "Letting a small consequence land is information, not sabotage. Rescuing removes the only feedback that would tell the Boss or Ops Manager that something needs to change.", "A careful ally is not a coalition. Marcus is a plausible ally because he's outside the triangle — but recruiting him into a shared grievance just adds a fourth corner to the same problem."], "cta": {"label": "CONTINUE", "next": "p2_tactics"}, "progress": 26, "mark": "tick"}, "p2_tactics": {"type": "checklist", "eyebrow": "PRE-TEACH · PART 2", "title": "The Tactics", "items": [["Stop invisible fixing", "make gaps visible instead of silently patching them."], ["Put it in writing", "a short recap email after every vague instruction, confirming specifics."], ["Draw the line once", "state the scope out loud, plainly, without over-explaining."], ["Let one thing land", "choose a low-stakes miss to not silently absorb."], ["Build allies carefully", "factual, specific conversations — not recruitment into a grievance."], ["Use any real channel", "an advisor, a board member — anyone who could actually intervene."]], "closing": "The next few weeks will test three of these in practice.", "cta": {"label": "BEGIN PART 2", "next": "p2_test"}, "progress": 29, "mark": "tick"}, "p2_test": {"type": "scene", "eyebrow": "THE FOLLOWING WEEKS", "title": "Testing It in Practice", "body": ["Naming the pattern was step one. Over the following weeks, three moments will test whether you can actually change your role in it — without waiting for Vivienne or Dana to change first.", "The first one arrives on a Tuesday morning."], "cta": {"label": "CONTINUE", "next": "d3"}, "progress": 32}, "d3": {"type": "decision", "eyebrow": "DECISION 2 OF 7 · BOUNDARY CHECK 1 OF 3", "title": "Written Record", "prompt": "Vivienne gives you another contradictory brief — verbally, in the hallway, already walking away. What do you do?", "options": [{"label": "Send a two-line recap email confirming exactly what you understood, and ask her to correct anything wrong.", "next": "d3_a", "boundary": 2}, {"label": "Work out what she probably meant and quietly get on with it, like always.", "next": "d3_b", "boundary": 0}, {"label": "Ask Dana to clarify it for you.", "next": "d3_c", "boundary": 1}], "progress": 34}, "d3_a": {"type": "outcome", "title": "Written Record", "choiceLabel": "“Send a two-line recap email confirming exactly what you understood, and ask her to correct anything wrong.”", "whatHappens": "Vivienne replies two words: “Yes, that.” It's the first time this month an instruction has actually been confirmed in writing — and now there's a record if the brief changes again later.", "cta": {"label": "CONTINUE", "next": "d4"}, "progress": 36}, "d3_b": {"type": "outcome", "title": "Written Record", "choiceLabel": "“Work out what she probably meant and quietly get on with it, like always.”", "whatHappens": "You guess right, this time. Nothing changes — for Vivienne, this brief looked exactly as clear as every other one, because you made it that way.", "cta": {"label": "CONTINUE", "next": "d4"}, "progress": 36}, "d3_c": {"type": "outcome", "title": "Written Record", "choiceLabel": "“Ask Dana to clarify it for you.”", "whatHappens": "Dana catches Vivienne for thirty seconds and comes back with: “She said it's fine either way.” It isn't actually fine either way, but Dana has no reason to push further — agreeing is the whole job, as far as she's concerned.", "cta": {"label": "CONTINUE", "next": "d4"}, "progress": 36}, "d4": {"type": "decision", "eyebrow": "DECISION 3 OF 7 · BOUNDARY CHECK 2 OF 3", "title": "The Scope Line", "prompt": "Dana asks if you can also take on a task that's technically hers — again. What do you do?", "options": [{"label": "Decline clearly: “That's outside what I can take on this week — it needs to stay with Ops.”", "next": "d4_a", "boundary": 2}, {"label": "Take it on again — just this once, like last time.", "next": "d4_b", "boundary": 0}, {"label": "Take it on, but mention to Vivienne afterward that this keeps happening.", "next": "d4_c", "boundary": 1}], "progress": 40}, "d4_a": {"type": "outcome", "title": "The Scope Line", "choiceLabel": "“Decline clearly: ‘That's outside what I can take on this week — it needs to stay with Ops.’”", "whatHappens": "It's awkward for about four seconds. Dana says “oh — okay,” and the task sits undone for a day before she deals with it herself. Nothing collapses. It's the first real evidence that the ceiling doesn't fall in when you say no.", "cta": {"label": "CONTINUE", "next": "d5"}, "progress": 42}, "d4_b": {"type": "outcome", "title": "The Scope Line", "choiceLabel": "“Take it on again — just this once, like last time.”", "whatHappens": "You get it done, like always. Dana doesn't ask if you're okay with it — because you've never once said you weren't.", "cta": {"label": "CONTINUE", "next": "d5"}, "progress": 42}, "d4_c": {"type": "outcome", "title": "The Scope Line", "choiceLabel": "“Take it on, but mention to Vivienne afterward that this keeps happening.”", "whatHappens": "Vivienne says “yeah, we should sort that out” and moves on to the next thing. You've done the task and flagged the pattern — but nothing about next week is any different, because flagging it cost you nothing and asked nothing of anyone else.", "cta": {"label": "CONTINUE", "next": "d5"}, "progress": 42}, "d5": {"type": "decision", "eyebrow": "DECISION 4 OF 7 · BOUNDARY CHECK 3 OF 3", "title": "Checking the Facts", "prompt": "You want to know if you're seeing this right. How do you approach Marcus?", "options": [{"label": "Factually: “Did Sales get contradictory dates on the Kessler rollout too, or was that just my brief?”", "next": "d5_a", "boundary": 2, "marcus": "factual"}, {"label": "By venting, and asking if he'll back you up if you raise it formally.", "next": "d5_b", "boundary": 0, "marcus": "vent"}, {"label": "You don't ask — you keep a private log of incidents instead.", "next": "d5_c", "boundary": 1, "marcus": "log"}], "progress": 46}, "d5_a": {"type": "outcome", "title": "Checking the Facts", "choiceLabel": "“Did Sales get contradictory dates on the Kessler rollout too, or was that just my brief?”", "whatHappens": "Marcus checks his messages and confirms: yes, two different dates, three days apart. It's small, specific, and exactly the kind of detail that turns “this feels off” into something you could actually show someone.", "extra": "Marcus corroborates — a concrete detail for your record.", "cta": {"label": "CONTINUE", "next": "cp2"}, "progress": 48}, "d5_b": {"type": "outcome", "title": "Checking the Facts", "choiceLabel": "“By venting, and asking if he'll back you up if you raise it formally.”", "whatHappens": "Marcus goes quiet. “I'd rather stay out of it,” he says. You don't get the confirmation you wanted, and he seems a little more careful around you afterward.", "extra": "Marcus pulls back — he's been burned by this before.", "cta": {"label": "CONTINUE", "next": "cp2"}, "progress": 48}, "d5_c": {"type": "outcome", "title": "Checking the Facts", "choiceLabel": "“You don't ask — you keep a private log of incidents instead.”", "whatHappens": "Safe, and useful in its own way — you now have dates and details written down. But it's only your version of events, with no outside confirmation that anyone else sees the same pattern.", "cta": {"label": "CONTINUE", "next": "cp2"}, "progress": 48}, "cp2": {"type": "checkpoint", "eyebrow": "CHECKPOINT", "title": "End of Part 2", "body": ["A few weeks in: some instructions are getting confirmed in writing, one boundary held without the business falling over, and there's at least one piece of outside evidence that this isn't just in your head.", "Nothing about Vivienne or Dana has changed — that was never really the point. What's changed is how much of the dysfunction you're still quietly absorbing. Eventually, that raises the real question."], "showScore": true, "cta": {"label": "CONTINUE", "next": "p3_intro"}, "progress": 52}, "p3_intro": {"type": "info", "eyebrow": "PRE-TEACH · PART 3", "title": "Make a Clean Exit", "body": ["Managing the triangle from inside buys time and protects your own standing — but it doesn't change who Vivienne is or what the environment allows. At some point, staying becomes a choice with real costs.", "This covers how to leave in a way that protects your health, your reputation, and your references — without one last act of over-functioning on the way out."], "footnote": "Read the vital information and exit steps below, then continue.", "cta": {"label": "CONTINUE", "next": "p3_info"}, "progress": 55}, "p3_info": {"type": "info", "eyebrow": "PRE-TEACH · PART 3", "title": "Vital Information", "body": ["Decide your exit criteria before you're in crisis. Naming the line in advance — a repeated broken agreement, no change after raising it, or your own health signs — means you're deciding on evidence, not in the middle of a bad day.", "Timing is part of the message. Leaving after a deliverable lands, on your own schedule, reads as a choice. Leaving mid-collapse reads as a casualty, whatever the real reasons were.", "Your written record becomes your evidence. The recap emails and logged incidents from Part 2 are what protect you if anything about your conduct is disputed after you're gone.", "A clean exit conversation states the decision once. It doesn't re-litigate every grievance, and it doesn't get pulled into negotiating the relationship instead of the role.", "Protect the reference, not the relationship. Staying professional and specific is what preserves a reference — over-explaining doesn't, and neither does one last rescue on the way out."], "cta": {"label": "CONTINUE", "next": "p3_exit"}, "progress": 58}, "p3_exit": {"type": "checklist", "eyebrow": "PRE-TEACH · PART 3", "title": "The Exit Steps", "items": [["Name your criteria", "decide in advance what would actually tell you it's time."], ["Time it on your terms", "wherever possible, after a deliverable lands — not mid-collapse."], ["Protect the paper trail", "your written record is what backs you up later."], ["Say it once, calmly", "state the decision, don't re-litigate the reasons."], ["Hand over without rescuing", "a written handover — not a personal guarantee the business survives."]], "closing": "How this actually plays out depends on what triggers it.", "cta": {"label": "BEGIN PART 3", "next": "d6"}, "progress": 61}, "d6": {"type": "decision", "eyebrow": "DECISION 5 OF 7 · CHOOSE YOUR PATH", "title": "What Finally Tells You It's Time", "prompt": "A few months on, something has to give. What's the trigger?", "options": [{"label": "You hit a limit you'd quietly set for yourself a while ago, and decide on your own terms.", "next": "pA_intro", "path": "A"}, {"label": "You're ready to go, but Vivienne asks you to just get the team through one more launch first.", "next": "pB_intro", "path": "B"}, {"label": "A blow-up in a client meeting pushes you to walk out that same afternoon.", "next": "pC_intro", "path": "C"}], "progress": 64}, "pA_intro": {"type": "scene", "eyebrow": "PATH A · YOUR OWN TERMS", "title": "A Decision, Not a Reaction", "body": ["There's no single dramatic moment — just the quiet recognition that the limit you set for yourself a while ago has been reached. Nothing about Vivienne or Dana is different today. That was never really what you were waiting for.", "The first thing you decide is how to have the conversation."], "cta": {"label": "CONTINUE", "next": "d7a"}, "progress": 68}, "d7a": {"type": "decision", "eyebrow": "DECISION 6 OF 7", "title": "The Conversation", "prompt": "How do you tell Vivienne you're resigning?", "options": [{"label": "Calmly, once: “I've decided to move on. I'll help make the handover smooth.”", "next": "d7a_a", "d7": "good"}, {"label": "You explain everything — every contradictory brief, every dropped task, in detail.", "next": "d7a_b", "d7": "bad"}, {"label": "You let Vivienne talk about how much she needs you, and half-agree to think about staying.", "next": "d7a_c", "d7": "bad"}], "progress": 72}, "d7a_a": {"type": "outcome", "title": "The Conversation", "choiceLabel": "“Calmly, once: ‘I've decided to move on. I'll help make the handover smooth.’”", "whatHappens": "Vivienne looks briefly thrown, then nods. There's no negotiation to have, because you haven't opened one. The decision stands exactly where you left it.", "cta": {"label": "CONTINUE", "next": "d8a"}, "progress": 76}, "d7a_b": {"type": "outcome", "title": "The Conversation", "choiceLabel": "“You explain everything — every contradictory brief, every dropped task, in detail.”", "whatHappens": "Vivienne gets defensive halfway through, and the conversation turns into a debate about specific incidents she remembers differently. You leave the room having relitigated six months of history instead of simply leaving.", "cta": {"label": "CONTINUE", "next": "d8a"}, "progress": 76}, "d7a_c": {"type": "outcome", "title": "The Conversation", "choiceLabel": "“You let Vivienne talk about how much she needs you, and half-agree to think about staying.”", "whatHappens": "You walk out having said the opposite of what you meant. The clean decision you made last week is now genuinely unclear again — to both of you.", "cta": {"label": "CONTINUE", "next": "d8a"}, "progress": 76}, "d8a": {"type": "decision", "eyebrow": "DECISION 7 OF 7", "title": "The Handover", "prompt": "With two weeks left, how do you handle the handover?", "options": [{"label": "A written handover document — clear, thorough, and finite.", "next": "d8a_a", "d8": "good"}, {"label": "You stay back most evenings trying to personally make sure nothing breaks after you're gone.", "next": "d8a_b", "d8": "tired"}, {"label": "You keep it minimal — you're leaving, it's not really your problem anymore.", "next": "d8a_c", "d8": "bad"}], "progress": 82}, "d8a_a": {"type": "outcome", "title": "The Handover", "choiceLabel": "“A written handover document — clear, thorough, and finite.”", "whatHappens": "It takes a solid afternoon, then it's done. What happens after you leave is genuinely not yours to carry anymore — and for the first time in a while, that feels true rather than guilty.", "cta": {"label": "SEE HOW IT ENDS", "next": "ending"}, "progress": 90}, "d8a_b": {"type": "outcome", "title": "The Handover", "choiceLabel": "“You stay back most evenings trying to personally make sure nothing breaks after you're gone.”", "whatHappens": "You leave exhausted instead of finished. It's the same instinct that put you in this position in the first place — just with a departure date attached to it.", "cta": {"label": "SEE HOW IT ENDS", "next": "ending"}, "progress": 90}, "d8a_c": {"type": "outcome", "title": "The Handover", "choiceLabel": "“You keep it minimal — you're leaving, it's not really your problem anymore.”", "whatHappens": "Understandable, but costly: two weeks from now, someone will be calling you to ask where things are. A thorough handover was the cheapest way to protect the goodwill you're leaving behind.", "cta": {"label": "SEE HOW IT ENDS", "next": "ending"}, "progress": 90}, "pB_intro": {"type": "scene", "eyebrow": "PATH B · ONE MORE LAUNCH", "title": "The Familiar Ask", "body": ["“I know it's a lot,” Vivienne says, “but if you could just get the team through this one launch first, it would mean everything.” It's the same request, dressed differently, that's worked on you a dozen times before.", "This time, what do you actually do?"], "cta": {"label": "CONTINUE", "next": "d7b"}, "progress": 68}, "d7b": {"type": "decision", "eyebrow": "DECISION 6 OF 7", "title": "One More Launch", "prompt": "How do you respond?", "options": [{"label": "Agree to stay for the launch, but set and communicate a firm final date now, in writing.", "next": "d7b_a", "d7": "good"}, {"label": "Agree, and quietly let your actual exit date stay open-ended “until things settle.”", "next": "d7b_b", "d7": "delay"}, {"label": "Recognise the trap for what it is, and hold your original exit date anyway.", "next": "d7b_c", "d7": "good"}], "progress": 72}, "d7b_a": {"type": "outcome", "title": "One More Launch", "choiceLabel": "“Agree to stay for the launch, but set and communicate a firm final date now, in writing.”", "whatHappens": "You get the launch, and Vivienne gets a real deadline to plan around instead of an open-ended favour. It costs you a few extra weeks — but on a date you chose, not one that kept sliding.", "cta": {"label": "CONTINUE", "next": "d8b"}, "progress": 76}, "d7b_b": {"type": "outcome", "title": "One More Launch", "choiceLabel": "“Agree, and quietly let your actual exit date stay open-ended ‘until things settle.’”", "whatHappens": "Things don't settle — they never really do. Six weeks later you're still there, and “one more launch” has quietly become the new normal, exactly like every deadline before it.", "cta": {"label": "CONTINUE", "next": "d8b"}, "progress": 76}, "d7b_c": {"type": "outcome", "title": "One More Launch", "choiceLabel": "“Recognise the trap for what it is, and hold your original exit date anyway.”", "whatHappens": "It's an uncomfortable conversation — Vivienne is frustrated, and the launch scrambles without you. But the date holds, and there's a strange relief in discovering the business survives a decision you don't personally manage.", "cta": {"label": "CONTINUE", "next": "d8b"}, "progress": 76}, "d8b": {"type": "decision", "eyebrow": "DECISION 7 OF 7", "title": "The Handover", "prompt": "Whenever your date finally arrives, how do you handle the handover?", "options": [{"label": "A written handover document — clear, thorough, and finite.", "next": "d8b_a", "d8": "good"}, {"label": "You're tired by now, and leave without documenting much at all.", "next": "d8b_b", "d8": "bad"}, {"label": "You stay available “just in case” for weeks after you've technically left.", "next": "d8b_c", "d8": "bad"}], "progress": 82}, "d8b_a": {"type": "outcome", "title": "The Handover", "choiceLabel": "“A written handover document — clear, thorough, and finite.”", "whatHappens": "Even a delayed exit ends cleanly. The document exists whether or not you're reachable afterward — which, this time, you're not.", "cta": {"label": "SEE HOW IT ENDS", "next": "ending"}, "progress": 90}, "d8b_b": {"type": "outcome", "title": "The Handover", "choiceLabel": "“You're tired by now, and leave without documenting much at all.”", "whatHappens": "By the time your date arrives, you're running on empty — and it shows in the handover. Understandable after everything, but it leaves loose ends that land back on you within the month.", "cta": {"label": "SEE HOW IT ENDS", "next": "ending"}, "progress": 90}, "d8b_c": {"type": "outcome", "title": "The Handover", "choiceLabel": "“You stay available ‘just in case’ for weeks after you've technically left.”", "whatHappens": "The messages keep coming, and you keep answering them, because that's the pattern that got you here in the first place. Leaving the job and leaving the role turn out to be two different things.", "cta": {"label": "SEE HOW IT ENDS", "next": "ending"}, "progress": 90}, "pC_intro": {"type": "scene", "eyebrow": "PATH C · THE BLOW-UP", "title": "Walking Out", "body": ["The client meeting goes badly — Vivienne contradicts a commitment you made last week, in front of the client, and blames you for the confusion. Something in you finally snaps, and you say so, out loud, in the room.", "You're in the car park twenty minutes later, resignation basically decided, adrenaline still running.", "What do you do next?"], "cta": {"label": "CONTINUE", "next": "d7c"}, "progress": 68}, "d7c": {"type": "decision", "eyebrow": "DECISION 6 OF 7", "title": "The Next Move", "prompt": "What's your next move?", "options": [{"label": "Take the rest of the day, then send a short, professional follow-up and written resignation the next morning.", "next": "d7c_a", "d7": "good"}, {"label": "Don't respond to anything — just stop showing up.", "next": "d7c_b", "d7": "bad"}, {"label": "Vent about what happened to colleagues and on social media that night.", "next": "d7c_c", "d7": "bad"}], "progress": 72}, "d7c_a": {"type": "outcome", "title": "The Next Move", "choiceLabel": "“Take the rest of the day, then send a short, professional follow-up and written resignation the next morning.”", "whatHappens": "The blow-up happened, but it doesn't have to be the whole story. A calm, timely follow-up recovers a surprising amount of ground — Vivienne and the client both remember the recovery almost as much as the incident.", "cta": {"label": "CONTINUE", "next": "d8c"}, "progress": 76}, "d7c_b": {"type": "outcome", "title": "The Next Move", "choiceLabel": "“Don't respond to anything — just stop showing up.”", "whatHappens": "It feels like relief for about a day. Then the silence becomes the entire story anyone tells about you afterward — there's no version of events except the one where you simply vanished.", "cta": {"label": "CONTINUE", "next": "d8c"}, "progress": 76}, "d7c_c": {"type": "outcome", "title": "The Next Move", "choiceLabel": "“Vent about what happened to colleagues and on social media that night.”", "whatHappens": "It feels justified in the moment, and it might even be accurate. It's also the kind of thing a future reference-checker finds in about four minutes — the blow-up stops being Vivienne's story and starts being yours.", "cta": {"label": "CONTINUE", "next": "d8c"}, "progress": 76}, "d8c": {"type": "decision", "eyebrow": "DECISION 7 OF 7", "title": "What's Left Behind", "prompt": "In the days after, how do you handle the handover?", "options": [{"label": "A short written summary of open items, sent even though you're not required to.", "next": "d8c_a", "d8": "good"}, {"label": "Nothing — you're gone, and it's not your problem anymore.", "next": "d8c_b", "d8": "mid"}, {"label": "You offer to come back in for a few hours, unpaid, to sort it out properly.", "next": "d8c_c", "d8": "bad"}], "progress": 82}, "d8c_a": {"type": "outcome", "title": "What's Left Behind", "choiceLabel": "“A short written summary of open items, sent even though you're not required to.”", "whatHappens": "It takes twenty minutes and changes how the whole exit reads. Even a crisis exit can end with a professional gesture that a reference-checker would actually recognise.", "cta": {"label": "SEE HOW IT ENDS", "next": "ending"}, "progress": 90}, "d8c_b": {"type": "outcome", "title": "What's Left Behind", "choiceLabel": "“Nothing — you're gone, and it's not your problem anymore.”", "whatHappens": "Fair, in a narrow sense — but combined with everything else that day, it completes a story with no recovery in it at all.", "cta": {"label": "SEE HOW IT ENDS", "next": "ending"}, "progress": 90}, "d8c_c": {"type": "outcome", "title": "What's Left Behind", "choiceLabel": "“You offer to come back in for a few hours, unpaid, to sort it out properly.”", "whatHappens": "It's generous, and it's also the Rescuer pattern again, right at the exit door. The instinct that put you in this position doesn't automatically switch off just because you've resigned.", "cta": {"label": "SEE HOW IT ENDS", "next": "ending"}, "progress": 90}, "epilogue": {"type": "epilogue", "eyebrow": "EPILOGUE", "title": "Six Weeks Later", "body": ["Vivienne is stressed. Dana tells her she’s a great boss, a competent boss — warm, true enough in the moment, and no help at all with the work that isn’t getting done. Then Dana starts leaving early too. Vivienne, afraid of losing her most loyal employee, lets her.", "A leaving card goes round the office. It’s Marcus’s. The quiet one in the corner, who had been watching the triangle the whole time, has resigned — Friday is his last day. It turns out the calm was never detachment. It was an exit, planned carefully, and already underway well before yours.", "You catch up for a drink. “For what it’s worth,” he says, “you saw it clearly, and you handled it well.” You’re not sure you believe him yet. You do look better. Though the job search took longer than it should have, because you were never quite certain what Vivienne would say if anyone rang.", "Marcus offers to act as your referee. You take him up on it.", "Meanwhile Vivienne is recruiting again. The job description is vague. The company is described as “a family.” Red flags, to anyone who knows to look.", "She isn’t cruel. She wants loyalty, and people who make her feel competent and in control. But the surest way to feel competent and in control is to be competent and in control — and that was never something anyone could hand her."], "marcusNote": "Unless you leaned on him too hard earlier — in which case he wishes you well, politely, at arm’s length, and the offer never comes. A limit on workplace alliances inside a toxic system, not a betrayal.", "cta": {"label": "REFERENCES", "next": "sources"}, "progress": 100}, "sources": {"type": "sources", "eyebrow": "REFERENCES", "title": "Sources", "intro": "The scenario is built on two established models.", "items": [{"ref": "Padilla, A., Hogan, R., &amp; Kaiser, R. B. (2007). The toxic triangle: Destructive leaders, susceptible followers, and conducive environments. <i>The Leadership Quarterly</i>, 18(3), 176–194.", "note": "The three-factor model the scenario is built on — a destructive leader, susceptible followers, and a conducive environment. Weaken any one leg and the triangle weakens."}, {"ref": "Karpman, S. (1968). Fairy tales and script drama analysis. <i>Transactional Analysis Bulletin</i>, 7(26), 39–43.", "note": "The Drama Triangle, and the Rescuer role that describes Nadia’s own part in sustaining the system."}], "cta": {"label": "RESTART DEMO", "next": "cover"}, "progress": 100}}, "endings": {"E1": {"tag": "ENDING 1", "title": "Clean Break", "desc": "Named the pattern, managed it without losing herself in it, and left on her own timeline with the relationship — and the reference — intact."}, "E2": {"tag": "ENDING 2", "title": "Recovered Control", "desc": "Got pulled into “one more launch,” recognised the trap, and still found a way to exit deliberately rather than let it become indefinite."}, "E3": {"tag": "ENDING 3", "title": "Recovered Reputation", "desc": "A genuine blow-up, but a calm, professional follow-up afterward recovered most of the ground — the recovery is remembered almost as much as the incident."}, "E4": {"tag": "ENDING 4", "title": "Slower Than It Should Have Been", "desc": "Delayed the exit past the point that was good for her, and left tired rather than finished — clean, but at a real personal cost."}, "E5": {"tag": "ENDING 5", "title": "Burned Bridge", "desc": "Over-explained, got talked into staying, disappeared, or rescued one last time on the way out — any path can end here if the exit itself is mishandled."}}, "boundaryBands": [[0, 1, "Still Absorbing It", "Most of the dysfunction is still landing on you — little was const pillNum = document.getElementById('scorePillNum');

const MINT_IDS = new Set(['p3_intro','p3_info','p3_exit','d6','pA_intro','pB_intro','pC_intro','d7a','d7b','d7c','d8a','d8b','d8c']);

function themeFor(id, type){
  if(type === 'outcome') return 'magenta';
  if(MINT_IDS.has(id)) return 'mint';
  return 'blue';
}

function resolveEnding(){
  const p = state.path, a=state.d7, b=state.d8;
  if(p==='A'){
    if(a==='bad') return 'E5';
    if(b==='bad') return 'E5';
    if(b==='tired') return 'E4';
    return 'E1';
  }
  if(p==='B'){
    if(b==='bad') return 'E5';
    if(a==='delay') return 'E4';
    return 'E2';
  }
  if(p==='C'){
    if(a==='bad') return 'E5';
    if(b!=='good') return 'E5';
    return 'E3';
  }
  return 'E1';
}
const ENDING_THEME = { E1:'teal', E2:'teal', E3:'amber', E4:'amber', E5:'red' };

function bandFor(score){
  for(const b of BANDS){ if(score>=b[0] && score<=b[1]) return {label:b[2], desc:b[3]}; }
  return {label:'', desc:''};
}

function renderBody(paras){
  return paras.map(p=>`<p class="body-p">${p}</p>`).join('');
}

function footerHTML(dark){
  return `<div class="footer-credit${dark?' on-dark':''}">${FOOTER_TEXT}</div>`;
}

function scoreBoxHTML(){
  const band = bandFor(state.boundary);
  const pct = Math.round((state.boundary/6)*100);
  return `<div class="score-box">
    <div class="row"><div class="label">Boundary Score</div><div class="num">${state.boundary} / 6</div></div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="band">${band.label}</div>
    <div class="desc">${band.desc}</div>
  </div>`;
}

function buildScreenHTML(screen, id){
  const theme = themeFor(id, screen.type);
  let header = '', body = '', cardClass = 'card';

  if(screen.type === 'cover'){
    cardClass += ' cover';
    body += `<div class="eyebrow">${screen.eyebrow}</div>`;
    body += `<h1 class="title">${screen.title}</h1>`;
    body += `<div class="subtitle">${screen.subtitle}</div>`;
    body += `<div class="meta-grid">` + screen.meta.map(m=>`<div class="meta-item"><div class="k">${m[0]}</div><div class="v">${m[1]}</div></div>`).join('') + `</div>`;
    body += `<div class="btn-row"><button class="btn" data-next="${screen.cta.next}">${screen.cta.label}</button></div>`;
    return `<div class="${cardClass}"><div class="content">${body}</div>${footerHTML(true)}</div>`;
  }

  if(screen.type === 'epilogue'){
    cardClass += ' epilogue';
    body += `<div class="eyebrow">${screen.eyebrow}</div>`;
    body += `<h1 class="title">${screen.title}</h1>`;
    body += renderBody(screen.body);
    if(screen.marcusNote && state.marcus === 'vent'){
      body += `<p class="marcus-note">${screen.marcusNote}</p>`;
    }
    body += `<div class="btn-row"><button class="btn yellow" data-next="${screen.cta.next}">${screen.cta.label}</button></div>`;
    return `<div class="${cardClass}"><div class="content">${body}</div>${footerHTML(true)}</div>`;
  }

  header = `<div class="header-band theme-${theme}${screen.type==='checkpoint'?' theme-checkpoint':''}"><div class="eyebrow">${screen.eyebrow||''}</div><h1 class="title">${screen.title}</h1></div>`;

  if(screen.type === 'info' || screen.type === 'scene'){
    if(screen.mark){
      body += `<div class="checklist">` + screen.body.map(t=>`<div class="item">${screen.mark?`<span class="qmark ${screen.mark}" aria-hidden="true">${screen.mark==='tick'?'\u2713':'?'}</span>`:''}<span>${t}</span></div>`).join('') + `</div>`;
    } else {
      body += renderBody(screen.body);
    }
    if(screen.footnote){ body += `<div class="footnote">${screen.footnote}</div>`; }
    body += `<div class="btn-row"><button class="btn" data-next="${screen.cta.next}">${screen.cta.label}</button></div>`;
  }
  else if(screen.type === 'checklist'){
    if(screen.intro){ body += `<p class="ask-intro">${screen.intro}</p>`; }
    body += `<div class="checklist">` + screen.items.map((it)=>`<div class="item">${screen.mark?`<span class="qmark ${screen.mark}" aria-hidden="true">${screen.mark==='tick'?'\u2713':'?'}</span>`:''}<span><b>${it[0]}</b> — ${it[1]}</span></div>`).join('') + `</div>`;
    if(screen.closing){ body += `<div class="closing">${screen.closing}</div>`; }
    body += `<div class="btn-row"><button class="btn" data-next="${screen.cta.next}">${screen.cta.label}</button></div>`;
  }
  else if(screen.type === 'decision'){
    body += `<p class="body-p">${screen.prompt}</p>`;
    body += `<div class="options">` + screen.options.map((o,i)=>{
      const eff = JSON.stringify({boundary:o.boundary||0, path:o.path||null, d7:o.d7||null, d8:o.d8||null, marcus:o.marcus||null, opt:i}).replace(/"/g,'&quot;');
      return `<button class="option opt-${i}" data-next="${o.next}" data-effect="${eff}"><span class="swatch">${"ABC"[i]}</span><span class="label-text">${o.label}</span><span class="select">Select this option</span></button>`;
    }).join('') + `</div>`;
  }
  else if(screen.type === 'outcome'){
    const oi = (state.lastOpt!=null ? state.lastOpt : 0);
    body += `<div class="choice-swatch-bar csb-${oi}">Option ${"ABC"[oi]}</div>`;
    body += `<div class="choice-quote">${screen.choiceLabel}</div>`;
    body += `<div class="wh-label">What happens</div>`;
    body += `<p class="body-p">${screen.whatHappens}</p>`;
    if(screen.extra){ body += `<div class="extra">${screen.extra}</div>`; }
    body += `<div class="btn-row"><button class="btn" data-next="${screen.cta.next}">${screen.cta.label}</button></div>`;
  }
  else if(screen.type === 'sources'){
    if(screen.intro){ body += `<p class="body-p">${screen.intro}</p>`; }
    body += `<div class="sources-list">` + screen.items.map(it=>`<div class="source"><div class="ref">${it.ref}</div><div class="note">${it.note}</div></div>`).join('') + `</div>`;
    body += `<div class="btn-row"><button class="btn" data-next="${screen.cta.next}">${screen.cta.label}</button></div>`;
  }
  else if(screen.type === 'checkpoint'){
    body += renderBody(screen.body);
    if(screen.showScore){ body += scoreBoxHTML(); }
    body += `<div class="btn-row"><button class="btn" data-next="${screen.cta.next}">${screen.cta.label}</button></div>`;
  }

  return `<div class="${cardClass}">${header}<div class="content">${body}</div>${footerHTML(false)}</div>`;
}

function buildEndingHTML(){
  const key = resolveEnding();
  const e = ENDINGS[key];
  const theme = ENDING_THEME[key];
  const header = `<div class="header-band theme-${theme}"><div class="eyebrow">HOW IT ENDS</div><h1 class="title">${e.title}</h1></div>`;
  let body = '';
  body += `<div class="ending-tag">${e.tag}</div>`;
  body += `<p class="body-p" style="font-size:18px;">${e.desc}</p>`;
  body += scoreBoxHTML();
  body += `<details class="recap"><summary>How this ending was decided</summary>
    <div class="line">Exit trigger (Decision 5): <b>Path ${state.path}</b></div>
    <div class="line">The Conversation / Next Move (Decision 6): <b>${state.d7}</b></div>
    <div class="line">The Handover (Decision 7): <b>${state.d8}</b></div>
    <div class="line">Boundary Score carried in from Part 2: <b>${state.boundary} / 6</b></div>
  </details>`;
  body += `<div class="btn-row"><button class="btn teal" data-next="epilogue">Continue to Epilogue</button></div>`;
  return `<div class="card">${header}<div class="content">${body}</div>${footerHTML(false)}</div>`;
}

function applyEffect(eff){
  if(!eff) return;
  if(eff.boundary){ state.boundary += eff.boundary; state.boundaryStarted = true; }
  if(eff.path){ state.path = eff.path; }
  if(eff.d7){ state.d7 = eff.d7; }
  if(eff.d8){ state.d8 = eff.d8; }
  if(eff.marcus){ state.marcus = eff.marcus; }
  if(eff.opt !== undefined && eff.opt !== null){ state.lastOpt = eff.opt; }
}

function updateHud(progress){
  fill.style.width = (progress||0) + '%';
  backBtn.classList.toggle('show', hist.length > 0);
  if(state.boundaryStarted){
    pill.classList.add('show');
    pillNum.textContent = state.boundary;
  } else {
    pill.classList.remove('show');
  }
}

function render(id){
  if(typeof stopSpeech === 'function') stopSpeech();
  currentId = id;
  let html, progress;
  if(id === 'ending'){
    html = buildEndingHTML();
    progress = 96;
  } else {
    const screen = SCREENS[id];
    if(!screen){ console.error('Unknown screen', id); return; }
    html = buildScreenHTML(screen, id);
    progress = screen.progress || 0;
  }
  const holder = document.createElement('div');
  holder.innerHTML = html;
  const card = holder.firstElementChild;
  card.classList.add('card');

  const existing = stage.querySelector('.card');
  if(existing){
    existing.classList.add('out');
    existing.classList.remove('in');
    setTimeout(()=>{ existing.remove(); }, 300);
  }
  stage.appendChild(card);
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ card.classList.add('in'); }); });

  updateHud(progress);
  window.scrollTo({top:0, behavior:'smooth'});

  card.querySelectorAll('[data-next]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const next = btn.getAttribute('data-next');
      const effRaw = btn.getAttribute('data-effect');
      if(next === 'cover'){
        hist = [];
        state = { boundary:0, path:null, d7:null, d8:null, marcus:null, boundaryStarted:false };
      } else {
        hist.push({ id: currentId, state: Object.assign({}, state) });
        if(effRaw){ applyEffect(JSON.parse(effRaw.replace(/&quot;/g,'"'))); }
      }
      render(next);
    });
  });
}

/* ---- read aloud ---------------------------------------------------- */
const audioBtn = document.getElementById('audioBtn');
const canSpeak = typeof window !== 'undefined' && 'speechSynthesis' in window;
if(canSpeak) audioBtn.hidden = false;

const READ_ORDER = '.eyebrow, h1.title, .subtitle, .meta-item .v, .body-p, .ask-intro,' +
  ' .checklist .item, .closing, .option .swatch, .option .label-text, .choice-swatch-bar,' +
  ' .choice-quote, .wh-label, .extra, .ending-tag, .score-box .band, .score-box .desc,' +
  ' .source .ref, .source .note, .footnote, .marcus-note';

/* Voice choice. Voices live on the visitor's device, so we can express a
   preference but not guarantee one. Scored by language code first (reliable,
   comes from the OS) with name hints only as a tiebreaker for gender.
   Override for testing with ?voice=Karen in the URL. */
const FEMALE_HINTS = ['karen','matilda','olivia','zoe','nicole','joanna','samantha',
                      'fiona','tessa','serena','sonia','kate','hazel','moira','female'];
const MALE_HINTS   = ['lee','james','russell','daniel','gordon','oliver','alex','male'];
let chosenVoice = null;

function pickVoice(){
  const all = window.speechSynthesis.getVoices() || [];
  if(!all.length) return null;
  const forced = new URLSearchParams(location.search).get('voice');
  if(forced){
    const hit = all.find(v => v.name.toLowerCase().includes(forced.toLowerCase()));
    if(hit) return hit;
  }
  const score = v => {
    const lang = (v.lang || '').replace('_','-').toLowerCase();
    const name = (v.name || '').toLowerCase();
    let s = 0;
    if(lang.startsWith('en-au')) s += 100;
    else if(lang.startsWith('en-nz')) s += 50;
    else if(lang.startsWith('en-gb')) s += 40;
    else if(lang.startsWith('en')) s += 10;
    else return -1000;
    if(FEMALE_HINTS.some(h => name.includes(h))) s += 30;
    if(MALE_HINTS.some(h => name.includes(h))) s -= 30;
    if(v.localService) s += 5;
    return s;
  };
  return all.slice().sort((a,b) => score(b) - score(a))[0] || null;
}

function screenText(){
  const card = stage.querySelector('.card');
  if(!card) return '';
  const parts = [];
  card.querySelectorAll(READ_ORDER).forEach(el=>{
    const t = (el.textContent || '').replace(/\s+/g,' ').trim();
    if(t) parts.push(/[.!?:]$/.test(t) ? t : t + '.');
  });
  return parts.join(' ');
}

function stopSpeech(){
  if(!canSpeak) return;
  window.speechSynthesis.cancel();
  audioBtn.classList.remove('speaking');
  audioBtn.textContent = 'Listen';
}

if(canSpeak){
  // getVoices() is empty until the list loads, so refresh on the event too
  chosenVoice = pickVoice();
  window.speechSynthesis.addEventListener('voiceschanged', ()=>{ chosenVoice = pickVoice(); });

  audioBtn.addEventListener('click', ()=>{
    if(window.speechSynthesis.speaking){ stopSpeech(); return; }
    const text = screenText();
    if(!text) return;
    if(!chosenVoice) chosenVoice = pickVoice();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95;
    if(chosenVoice){ u.voice = chosenVoice; u.lang = chosenVoice.lang; }
    else { u.lang = 'en-AU'; }
    u.onend = stopSpeech;
    u.onerror = stopSpeech;
    audioBtn.classList.add('speaking');
    audioBtn.textContent = 'Stop';
    window.speechSynthesis.speak(u);
  });
  // never let one screen keep talking over the next
  window.addEventListener('beforeunload', stopSpeech);

  /* List what this device actually has:  listVoices()  in the browser console */
  window.listVoices = () => console.table(
    window.speechSynthesis.getVoices().map(v => ({name:v.name, lang:v.lang, local:v.localService}))
  );
}

backBtn.addEventListener('click', ()=>{
  const prev = hist.pop();
  if(!prev) return;
  state = prev.state;      // rewind the score with the screen
  render(prev.id);
});

render('cover');

</script>
</body>
</html>
